<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maritime Pollution Forensics</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
:root {
  --ink:#0b1420; --panel:#101c2c; --panel-raised:#16273b;
  --line:#23374d; --text:#dbe6f0; --text-dim:#7d94ab;
  --amber:#e0a458; --cyan:#4fd1c5; --red:#e0645a;
  --mono:"IBM Plex Mono","SF Mono",Consolas,monospace;
  --sans:"IBM Plex Sans","Segoe UI",sans-serif;
}

* { box-sizing:border-box; }

html,body {
  margin:0; height:100%; background:var(--ink);
  color:var(--text); font-family:var(--sans);
}

#app {
  display:grid;
  grid-template-columns:1fr 380px;
  grid-template-rows:56px 1fr;
  height:100vh;
}

header {
  grid-column:1/3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}

header .title {
  font-size:15px;
  letter-spacing:.02em;
  font-weight:600;
}

header .title span {
  color:var(--text-dim);
  font-weight:400;
  margin-left:10px;
}

select#caseSelect {
  background:var(--panel-raised);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:4px;
  padding:6px 10px;
  font-family:var(--mono);
  font-size:12.5px;
}

#map {
  width:100%;
  height:100%;
  background:#0b1420;
}

#side {
  border-left:1px solid var(--line);
  background:var(--panel);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.block {
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}

.block h2 {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--text-dim);
  margin:0 0 10px;
  font-weight:600;
}

.stat-row {
  display:flex;
  justify-content:space-between;
  font-size:13px;
  padding:3px 0;
}

.stat-row .k { color:var(--text-dim); }
.stat-row .v { font-family:var(--mono); }

.vessel-card {
  background:var(--panel-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 12px;
  margin-bottom:8px;
  cursor:pointer;
  transition:border-color .15s;
}

.vessel-card:hover { border-color:var(--cyan); }
.vessel-card.active { border-color:var(--amber); background:#1c2c40; }

.vessel-card .row1 {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}

.vessel-card .rank {
  color:var(--text-dim);
  font-family:var(--mono);
  font-size:11px;
  margin-right:6px;
}

.vessel-card .name {
  font-size:13.5px;
  font-weight:600;
}

.vessel-card .score {
  font-family:var(--mono);
  font-size:15px;
  color:var(--amber);
}

.vessel-card .conf {
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--text-dim);
  margin-top:2px;
}

.bar-row { margin:8px 0; }

.bar-row .label {
  display:flex;
  justify-content:space-between;
  font-size:11.5px;
  color:var(--text-dim);
  margin-bottom:3px;
}

.bar-track {
  height:6px;
  background:#0b1420;
  border-radius:3px;
  overflow:hidden;
}

.bar-fill {
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--amber));
}

.explanation {
  font-size:12.5px;
  line-height:1.5;
  color:var(--text-dim);
  padding:4px 0;
}

.gap-flag {
  display:inline-block;
  margin-top:6px;
  font-size:11px;
  color:var(--red);
  font-family:var(--mono);
}

.back-link {
  font-size:12px;
  color:var(--cyan);
  cursor:pointer;
  margin-bottom:10px;
  display:inline-block;
}


/* NEW: risk mode UI */

.mode-switch {
  display:flex;
  gap:6px;
  align-items:center;
}

.mode-btn {
  background:var(--panel-raised);
  color:var(--text-dim);
  border:1px solid var(--line);
  border-radius:4px;
  padding:7px 10px;
  font-family:var(--mono);
  font-size:11px;
  cursor:pointer;
}

.mode-btn.active {
  color:var(--text);
  border-color:var(--cyan);
  background:#1c2c40;
}

.risk-card {
  background:var(--panel-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:11px 12px;
  margin-bottom:8px;
  cursor:pointer;
}

.risk-card:hover { border-color:var(--cyan); }

.risk-card .row1 {
  display:flex;
  justify-content:space-between;
}

.risk-name {
  font-size:13.5px;
  font-weight:600;
}

.risk-score {
  font-family:var(--mono);
  font-size:15px;
  color:var(--amber);
}

.risk-level {
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.06em;
  margin-top:3px;
}

.risk-high { color:var(--red); }
.risk-medium { color:var(--amber); }

.risk-note {
  font-size:11.5px;
  line-height:1.5;
  color:var(--text-dim);
  margin-top:8px;
}

/* END risk mode UI */


::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-thumb {
  background:var(--line);
  border-radius:4px;
}

.leaflet-popup-content-wrapper {
  background:var(--panel-raised);
  color:var(--text);
}

.leaflet-popup-tip { background:var(--panel-raised); }
</style>
</head>

<body>

<div id="app">

  <!-- NEW: dashboard mode switch -->
  <header>
    <div class="title">
      MARITIME POLLUTION FORENSICS
      <span id="obsTime"></span>
    </div>

    <div class="mode-switch">
      <button id="investigateBtn" class="mode-btn active"
        onclick="setMode('investigate')">
        INCIDENT INVESTIGATION
      </button>

      <button id="riskBtn" class="mode-btn"
        onclick="setMode('risk')">
        PROBABLE RISK ZONES
      </button>

      <select id="caseSelect"></select>
    </div>
  </header>
  <!-- END dashboard mode switch -->

  <div id="map"></div>
  <div id="side"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>

const API = "http://127.0.0.1:8000";

const map = L.map("map", {
  zoomControl:true
}).setView([19.0,72.6],10);

L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  {
    attribution:"Tiles &copy; Esri",
    maxZoom:16
  }
).addTo(map);

let layerGroup = L.layerGroup().addTo(map);
let activeVesselId = null;
let currentCase = null;
let dashboardMode = "investigate";

const colors = {
  spill:"#e0645a",
  origin:"#ffd166",
  drift:"#4fd1c5",
  vessel:"#dbe6f0",
  active:"#e0a458"
};


/* NEW: frontend-only risk zones using current case data */

function getRiskZones() {

  const o = currentCase?.origin?.centroid;

  if (!o) return [];

  const vessels = currentCase.vessels.length;
  const topScore = Number(
    currentCase.vessels[0]?.overall_score || 0
  );

  return [
    {
      name:"CURRENT ORIGIN ZONE",
      level:"HIGH",
      score:Math.min(
        95,
        Math.round(60 + vessels + topScore * .15)
      ),
      lat:o.lat,
      lon:o.lon,
      radius:.07,
      reason:`${vessels} candidate vessels in the synthetic AIS scenario`
    },
    {
      name:"NORTHWEST TRAFFIC CORRIDOR",
      level:"MEDIUM-HIGH",
      score:71,
      lat:o.lat + .16,
      lon:o.lon - .14,
      radius:.06,
      reason:"Synthetic AIS traffic around the investigation region"
    },
    {
      name:"SOUTHWEST TRAFFIC CORRIDOR",
      level:"MEDIUM",
      score:56,
      lat:o.lat - .15,
      lon:o.lon - .10,
      radius:.055,
      reason:"Lower vessel concentration in the synthetic scenario"
    }
  ];
}

/* END risk zones */


async function loadCases() {

  const res = await fetch(`${API}/api/cases`);
  const cases = await res.json();
  const sel = document.getElementById("caseSelect");

  sel.innerHTML = cases.map(c =>
    `<option value="${c.slick_id}">
      ${c.slick_id} — top score ${c.top_score}
    </option>`
  ).join("");

  sel.addEventListener(
    "change",
    () => loadCase(sel.value)
  );

  if (cases.length)
    loadCase(cases[0].slick_id);
}


async function loadCase(slickId) {

  const res = await fetch(`${API}/api/case/${slickId}`);

  currentCase = await res.json();
  activeVesselId = null;

  document.getElementById("obsTime").textContent =
    currentCase.observation_time || "";

  renderMap();
  renderSide();
}


/* Existing investigation map + risk mode switch */

function renderMap() {

  layerGroup.clearLayers();

  if (dashboardMode === "risk") {
    renderRiskMap();
    return;
  }

  const c = currentCase;
  const bounds = [];

  if (c.spill.geometry) {

    const gj = L.geoJSON(
      c.spill.geometry,
      {
        style:{
          color:colors.spill,
          weight:2,
          fillOpacity:.25
        }
      }
    ).addTo(layerGroup);

    gj.eachLayer(
      l => bounds.push(l.getBounds())
    );
  }

  if (c.origin?.centroid) {

    const o = c.origin.centroid;

    L.circleMarker(
      [o.lat,o.lon],
      {
        radius:7,
        color:colors.origin,
        fillColor:colors.origin,
        fillOpacity:.9
      }
    )
    .bindPopup(
      `Estimated origin<br>
       ${c.origin.estimated_spill_time_utc || ""}`
    )
    .addTo(layerGroup);

    bounds.push(
      L.latLngBounds([[o.lat,o.lon]])
    );
  }

  if (c.hindcast_path?.lats) {

    const pts =
      c.hindcast_path.lats
      .map((lat,i) => [
        lat,
        c.hindcast_path.lons[i]
      ])
      .filter(p => p[0] != null && p[1] != null);

    if (pts.length) {

      L.polyline(
        pts,
        {
          color:colors.drift,
          weight:2,
          dashArray:"4 4"
        }
      ).addTo(layerGroup);

      bounds.push(
        L.latLngBounds(pts)
      );
    }
  }

  if (c.forecast_path?.lats) {

    const pts =
      c.forecast_path.lats
      .map((lat,i) => [
        lat,
        c.forecast_path.lons[i]
      ])
      .filter(p => p[0] != null && p[1] != null);

    if (pts.length) {

      L.polyline(
        pts,
        {
          color:colors.drift,
          weight:2
        }
      ).addTo(layerGroup);

      bounds.push(
        L.latLngBounds(pts)
      );
    }
  }

  c.vessels.forEach(v => {

    const track =
      (v.track || [])
      .filter(
        p =>
          p.latitude != null &&
          p.longitude != null
      );

    if (!track.length) return;

    const active =
      v.vessel_id === activeVesselId;

    const pts =
      track.map(
        p => [p.latitude,p.longitude]
      );

    L.polyline(
      pts,
      {
        color:
          active
            ? colors.active
            : colors.vessel,

        weight:
          active ? 3 : 1,

        opacity:
          active ? 1 : .35
      }
    ).addTo(layerGroup);

    const last =
      track[track.length - 1];

    L.circleMarker(
      [
        last.latitude,
        last.longitude
      ],
      {
        radius:active ? 6 : 4,
        color:active ? colors.active : colors.vessel,
        fillColor:active ? colors.active : colors.vessel,
        fillOpacity:.9
      }
    )
    .bindPopup(
      `#${v.rank} ${v.vessel_name}<br>
       Score: ${v.overall_score}`
    )
    .addTo(layerGroup);

    if (active)
      bounds.push(L.latLngBounds(pts));

  });

  if (bounds.length) {

    let combined = bounds[0];

    bounds.forEach(
      b => combined = combined.extend(b)
    );

    map.fitBounds(
      combined,
      {padding:[40,40]}
    );
  }
}


/* NEW: render probable risk zones */

function renderRiskMap() {

  const zones = getRiskZones();
  const bounds = [];

  zones.forEach(z => {

    const color =
      z.level === "HIGH"
        ? colors.spill
        : z.level === "MEDIUM-HIGH"
        ? colors.active
        : colors.origin;

    const circle = L.circle(
      [z.lat,z.lon],
      {
        radius:z.radius * 111000,
        color,
        weight:2,
        fillColor:color,
        fillOpacity:.22
      }
    )
    .bindPopup(`
      <b>${z.name}</b><br>
      Risk Score: ${z.score}/100<br>
      Risk Level: ${z.level}<br><br>
      ${z.reason}
    `)
    .addTo(layerGroup);

    bounds.push(circle.getBounds());
  });

  if (currentCase?.origin?.centroid) {

    const o =
      currentCase.origin.centroid;

    L.circleMarker(
      [o.lat,o.lon],
      {
        radius:6,
        color:colors.origin,
        fillColor:colors.origin,
        fillOpacity:1
      }
    )
    .bindPopup(`
      <b>Current spill origin</b><br>
      ${currentCase.origin.estimated_spill_time_utc || ""}
    `)
    .addTo(layerGroup);
  }

  if (bounds.length) {

    let combined = bounds[0];

    bounds.forEach(
      b => combined = combined.extend(b)
    );

    map.fitBounds(
      combined,
      {padding:[50,50]}
    );
  }
}

/* END probable risk map */


function renderSide() {

  const c = currentCase;
  const side = document.getElementById("side");

  if (dashboardMode === "risk") {
    renderRiskSide();
    return;
  }

  if (activeVesselId) {

    const v =
      c.vessels.find(
        v => v.vessel_id === activeVesselId
      );

    side.innerHTML = `

      <div class="block">

        <span
          class="back-link"
          onclick="deselectVessel()"
        >
          &larr; back to suspects
        </span>

        <h2>${v.vessel_name}</h2>

        <div class="stat-row">
          <span class="k">MMSI</span>
          <span class="v">${v.vessel_id}</span>
        </div>

        <div class="stat-row">
          <span class="k">Type</span>
          <span class="v">${v.vessel_type || "—"}</span>
        </div>

        <div class="stat-row">
          <span class="k">Overall score</span>
          <span
            class="v"
            style="color:var(--amber)"
          >
            ${v.overall_score}
          </span>
        </div>

        <div class="stat-row">
          <span class="k">Confidence</span>
          <span class="v">${v.confidence}</span>
        </div>

      </div>

      <div class="block">

        <h2>Evidence breakdown</h2>

        ${
          Object.entries(v.evidence || {})
          .map(([k,val]) => bar(k,val))
          .join("")
        }

      </div>

      <div class="block">

        <h2>Explanation</h2>

        ${
          (v.explanation || [])
          .map(
            e =>
              `<div class="explanation">
                • ${e}
              </div>`
          )
          .join("")
        }

        ${
          v.gaps?.length
            ? `
              <div class="gap-flag">
                ⚠ ${v.gaps.length}
                AIS gap(s) detected
              </div>
            `
            : ""
        }

      </div>
    `;

    return;
  }

  side.innerHTML = `

    <div class="block">

      <h2>Spill summary</h2>

      <div class="stat-row">
        <span class="k">Case</span>
        <span class="v">${c.slick_id}</span>
      </div>

      <div class="stat-row">
        <span class="k">Area</span>
        <span class="v">
          ${c.spill.area_km2 ?? "—"} km²
        </span>
      </div>

      <div class="stat-row">
        <span class="k">Detection conf.</span>
        <span class="v">
          ${
            c.spill.confidence != null
              ? Math.round(
                  c.spill.confidence * 100
                ) + "%"
              : "—"
          }
        </span>
      </div>

      <div class="stat-row">
        <span class="k">Origin est.</span>
        <span class="v">
          ${
            c.origin
              ? c.origin.estimated_spill_time_utc
              : "—"
          }
        </span>
      </div>

    </div>

    <div
      class="block"
      style="flex:1;"
    >

      <h2>
        Ranked suspects
        (${c.vessels.length})
      </h2>

      ${
        c.vessels.map(v => `

          <div
            class="vessel-card"
            onclick="
              selectVessel('${v.vessel_id}')
            "
          >

            <div class="row1">

              <div>

                <span class="rank">
                  #${v.rank}
                </span>

                <span class="name">
                  ${v.vessel_name}
                </span>

              </div>

              <div class="score">
                ${v.overall_score}
              </div>

            </div>

            <div class="conf">
              ${v.confidence} confidence
            </div>

          </div>

        `).join("")
      }

    </div>
  `;
}


/* NEW: risk-zone sidebar */

function renderRiskSide() {

  const c = currentCase;
  const side = document.getElementById("side");
  const zones = getRiskZones();

  side.innerHTML = `

    <div class="block">

      <h2>Probable Risk Zones</h2>

      <div class="stat-row">
        <span class="k">Scenario</span>
        <span class="v">${c.slick_id}</span>
      </div>

      <div class="stat-row">
        <span class="k">Forecast window</span>
        <span class="v">Next 24h</span>
      </div>

      <div class="stat-row">
        <span class="k">AIS candidates</span>
        <span class="v">${c.vessels.length}</span>
      </div>

    </div>

    <div
      class="block"
      style="flex:1;"
    >

      <h2>Risk assessment</h2>

      ${
        zones.map((z,i) => `

          <div
            class="risk-card"
            onclick="focusRiskZone(${i})"
          >

            <div class="row1">

              <span class="risk-name">
                #${i + 1} ${z.name}
              </span>

              <span class="risk-score">
                ${z.score}
              </span>

            </div>

            <div class="
              risk-level
              ${z.level === "HIGH"
                ? "risk-high"
                : "risk-medium"}
            ">
              ${z.level} RISK
            </div>

            <div class="risk-note">
              ${z.reason}
            </div>

          </div>

        `).join("")
      }

    </div>

    <div class="block">

      <h2>Assessment basis</h2>

      <div class="risk-note">
        Based on the current synthetic AIS
        scenario and investigation outputs.

        <br><br>

        Prototype visualization only.
        Not a trained spill-probability model.
      </div>

    </div>
  `;
}

/* END risk-zone sidebar */


function focusRiskZone(index) {

  const zone =
    getRiskZones()[index];

  if (!zone) return;

  map.setView(
    [zone.lat,zone.lon],
    11
  );
}


function bar(label,value) {

  const rounded =
    Math.round(value * 10) / 10;

  return `

    <div class="bar-row">

      <div class="label">
        <span>${label}</span>
        <span>${rounded}</span>
      </div>

      <div class="bar-track">

        <div
          class="bar-fill"
          style="
            width:${Math.max(
              0,
              Math.min(100,rounded)
            )}%
          "
        ></div>

      </div>

    </div>
  `;
}


function selectVessel(id) {

  activeVesselId = id;

  renderMap();
  renderSide();
}


function deselectVessel() {

  activeVesselId = null;

  renderMap();
  renderSide();
}


/* NEW: switch between investigation and risk views */

function setMode(mode) {

  dashboardMode = mode;
  activeVesselId = null;

  document
    .getElementById("investigateBtn")
    .classList.toggle(
      "active",
      mode === "investigate"
    );

  document
    .getElementById("riskBtn")
    .classList.toggle(
      "active",
      mode === "risk"
    );

  renderMap();
  renderSide();
}

/* END mode switch */


loadCases();

</script>
</body>
</html>
